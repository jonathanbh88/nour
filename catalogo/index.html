<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8C2A5B">
<title>Catálogo</title>
<meta name="description" content="Catálogo digital com pedido pelo WhatsApp.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src https://*.supabase.co; frame-src https://www.google.com; base-uri 'self'; form-action 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
<div id="app"></div>
<script src="js/config.js"></script>
<script src="js/protecao.js"></script>
<script>
/* ?loja=slug lê a loja do banco; ?modelo=pet-shop abre um modelo pronto (demonstração); sem nada, usa js/dados.js */
(function () {
  var q = location.search, loja = (q.match(/[?&]loja=([a-z0-9-]+)/) || [])[1], m = (q.match(/[?&]modelo=([a-z0-9-]+)/) || [])[1];
  // Em /loja/<slug>/ a página vem do servidor com os dados embutidos; os arquivos ficam em /catalogo/.
  var B = document.querySelector('script[src$="js/config.js"]').src.replace(/js\/config\.js.*$/, ''), emb = document.getElementById('nour-dados');
  function load(src, next) { var s = document.createElement('script'); s.src = B + src; s.onload = next || null; s.onerror = function () { if (m) location.replace(location.pathname); }; document.body.appendChild(s); }
  function aviso(t) { document.getElementById('app').innerHTML = '<div style="max-width:420px;margin:18vh auto;padding:0 16px;text-align:center;font-family:Outfit,system-ui,sans-serif"><h1 style="font-size:1.4rem">' + t + '</h1><p style="color:#6B617D">Confira o endereço ou fale com a loja.</p></div>'; }
  function abre(d) {
    window.LOJA = Object.assign({ nome: d.nome }, d.loja, { id: d.slug, api: true, avaliacoes: d.avaliacoes || [] });
    window.CATEGORIAS = d.categorias || []; window.PRODUTOS = d.produtos || []; window.NOUR_ABRIR = d.abrir || '';
    load('js/catalogo.js');
  }
  var pv = (q.match(/[?&]previa=([a-z0-9-]+)/) || [])[1];
  if (pv) {
    // Prévia do painel: lê o rascunho salvo pelo editor; não grava visitas, cookies nem pedidos.
    var r = null; try { r = JSON.parse(localStorage.getItem('nourprevia:' + pv) || 'null'); } catch (e) {}
    if (!r) return load('js/dados.js', function () { load('js/catalogo.js'); });
    window.LOJA = Object.assign({ nome: r.nome }, r.loja, { id: 'previa-' + pv, api: false, previa: true, cookies: false, avaliacoes: r.avaliacoes || [] });
    window.CATEGORIAS = r.categorias || []; window.PRODUTOS = r.produtos || [];
    return load('js/catalogo.js');
  }
  if (emb) { try { abre(JSON.parse(emb.textContent)); } catch (e) { aviso('Não foi possível abrir a loja agora'); } }
  else if (loja) {
    window.nourRpc('catalogo_publico', { p_slug: loja }).then(function (d) {
      if (!d || !d.loja) return aviso('Loja não encontrada');
      abre(d);
    }).catch(function () { aviso('Não foi possível abrir a loja agora'); });
  } else load(m ? 'modelos/' + m + '.js' : 'js/dados.js', function () { load('js/catalogo.js'); });
})();
</script>
</body>
</html>
