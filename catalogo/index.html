<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8C2A5B">
<title>Catálogo</title>
<meta name="description" content="Catálogo digital com pedido pelo WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
<div id="app"></div>
<script>
/* ?modelo=pet-shop abre um modelo pronto da pasta modelos/ (para demonstração); sem isso, usa js/dados.js */
(function () {
  var m = (location.search.match(/[?&]modelo=([a-z0-9-]+)/) || [])[1];
  var fila = [m ? 'modelos/' + m + '.js' : 'js/dados.js', 'js/catalogo.js'];
  (function next() { var src = fila.shift(); if (!src) return; var s = document.createElement('script'); s.src = src; s.onload = next; s.onerror = function () { if (m) location.replace(location.pathname); }; document.body.appendChild(s); })();
})();
</script>
</body>
</html>
